[project]
name = "welness-bot"
version = "0.1.0"
description = "Internal Telegram bot: Radar (push content) + Insight (pull audience analysis)"
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.15",
    "aiohttp>=3.10",
    "anthropic>=0.40",
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "apscheduler>=3.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "loguru>=0.7",
    "sentry-sdk>=2.18",
    "PyGithub>=2.5",
    "tenacity>=9.0",
    "google-api-python-client>=2.0",
    "google-generativeai>=0.8",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "vcrpy>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
